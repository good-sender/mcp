# Publishes a GitHub Release: container images first, then MCP Registry.
#
# Two stages, each ending in a hosted MCP deploy (good-sender/hosted-mcp-deployment,
# whose Cloud Build triggers deploy `main` → dev and `production` → prod):
#   - dev:  repository_dispatch `draft-release` (sent by goodsender-mcp-go once the
#           draft here has its assets). Version tags only (no :latest), no
#           Registry; commits the image pin to hosted-mcp-deployment `main`.
#   - prod: release published (or workflow_dispatch). Adds :latest, publishes to
#           the Registry; merges the dev pin commit into `production`.
#
# Auth uses GitHub Actions OIDC, so no tokens/secrets are needed to claim the
# io.github.good-sender/* namespace (the workflow runs inside good-sender/mcp).
#
# Containers: ghcr.io/good-sender/mcp, docker.io/goodsender/goodsender-mcp
# Registry: MCPB + OCI packages (registry validates the Docker image exists)
#
# Prereqs:
#   - server.template.json, scripts/gen-server-json.sh
#   - Dockerfile LABEL io.modelcontextprotocol.server.name="io.github.good-sender/goodsender-mcp"
#   - SDK_DISPATCH_APP_ID / SDK_DISPATCH_APP_PRIVATE_KEY, with the App installed
#     on hosted-mcp-deployment (contents: write)

name: Publish release

on:
  release:
    types: [published]
  repository_dispatch:
    types: [draft-release]
  workflow_dispatch:
    inputs:
      ref:
        description: "Published release tag (e.g. v1.2.3)."
        required: true
        type: string

concurrency:
  group: publish-release-${{ github.event_name }}-${{ github.event.release.tag_name || inputs.ref || github.event.client_payload.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write    # required for GitHub OIDC auth to the MCP Registry

env:
  BINARIES_ASSET_NAME: binaries.zip

jobs:
  publish-container:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write    # GITHUB_TOKEN only sees draft releases with write access
      packages: write
    outputs:
      ref: ${{ steps.in.outputs.ref }}
      version: ${{ steps.in.outputs.version }}
      stage: ${{ steps.in.outputs.stage }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve ref
        id: in
        env:
          INPUT_REF: ${{ inputs.ref }}
          DISPATCH_REF: ${{ github.event.client_payload.ref }}
        run: |
          set -euo pipefail
          stage=prod
          case "${{ github.event_name }}" in
            workflow_dispatch) ref="$INPUT_REF" ;;
            repository_dispatch) ref="$DISPATCH_REF"; stage=dev ;;
            *) ref="${{ github.event.release.tag_name }}" ;;
          esac
          if [[ ! "$ref" =~ ^v[0-9] ]]; then
            echo "!! ref must be a v* tag (got: '$ref')" >&2
            exit 1
          fi
          version="${ref#v}"
          tags=""
          for repo in ghcr.io/good-sender/mcp docker.io/goodsender/goodsender-mcp; do
            [[ "$stage" == "prod" ]] && tags+="${repo}:latest"$'\n'
            tags+="${repo}:${version}"$'\n'"${repo}:${ref}"$'\n'
          done
          {
            echo "ref=$ref"
            echo "version=$version"
            echo "stage=$stage"
            echo "tags<<EOF"
            printf '%s' "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve and download release binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ steps.in.outputs.ref }}
          STAGE: ${{ steps.in.outputs.stage }}
        run: |
          set -euo pipefail
          # Not releases/tags/<tag>: that endpoint never returns drafts.
          release_json="$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq "map(select(.tag_name == \"${REF}\"))[0]")"
          if [[ -z "$release_json" || "$release_json" == "null" ]]; then
            echo "!! no release for $REF" >&2
            exit 1
          fi
          draft="$(jq -r '.draft' <<<"$release_json")"
          if [[ "$STAGE" == "prod" && "$draft" != "false" ]]; then
            echo "!! release $REF is draft" >&2
            exit 1
          fi
          asset_url="$(jq -r --arg name "$BINARIES_ASSET_NAME" \
            '.assets[] | select(.name == $name) | .url' <<<"$release_json")"
          if [[ -z "$asset_url" || "$asset_url" == "null" ]]; then
            echo "!! $BINARIES_ASSET_NAME not found on release $REF" >&2
            exit 1
          fi
          case "$asset_url" in
            https://api.github.com/repos/"${{ github.repository }}"/releases/assets/[0-9]*) ;;
            *)
              echo "!! resolved asset URL is unexpected: $asset_url" >&2
              exit 1
              ;;
          esac
          mkdir -p bin
          curl --fail --location --show-error --silent \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "$asset_url" -o bin/binaries.zip
          unzip -q bin/binaries.zip -d bin
          test -x bin/goodsender-mcp-linux-amd64
          test -x bin/goodsender-mcp-linux-arm64

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.in.outputs.tags }}

      - name: Summary
        env:
          TAGS: ${{ steps.in.outputs.tags }}
        run: |
          {
            echo "## Published containers"
            sed 's/.*/- `&`/' <<<"$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"

  # Pins the image in hosted-mcp-deployment; its Cloud Build triggers deploy.
  # dev: commit the pin to `main`. prod: merge that same pin commit into
  # `production`, so prod gets exactly what dev ran (plus nothing newer).
  deploy-hosted:
    needs: publish-container
    runs-on: ubuntu-latest
    steps:
      - name: Mint token for hosted-mcp-deployment
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SDK_DISPATCH_APP_ID }}
          private-key: ${{ secrets.SDK_DISPATCH_APP_PRIVATE_KEY }}
          owner: good-sender
          repositories: hosted-mcp-deployment

      - uses: actions/checkout@v6
        with:
          repository: good-sender/hosted-mcp-deployment
          token: ${{ steps.app_token.outputs.token }}
          fetch-depth: 0

      - name: Pin and push
        env:
          STAGE: ${{ needs.publish-container.outputs.stage }}
          REF: ${{ needs.publish-container.outputs.ref }}
          BOT: ${{ steps.app_token.outputs.app-slug }}[bot]
        run: |
          set -euo pipefail
          git config user.name "$BOT"
          git config user.email "${BOT}@users.noreply.github.com"
          image="ghcr.io/good-sender/mcp:${REF}"
          pin_file=ansible/group_vars/all.yml

          if [[ "$STAGE" == "dev" ]]; then
            sed -i -E "s|^mcp_image: .*|mcp_image: \"${image}\"|" "$pin_file"
            if git diff --quiet; then
              echo "main already pins $image"
            else
              git commit -am "all.yml: pin MCP image ${REF}"
              git push origin HEAD:main
            fi
          else
            # Newest commit that sets the pin (-S also matches the one replacing it).
            pin_line="mcp_image: \"${image}\""
            pin_commit=""
            for c in $(git log origin/main --format=%H -S "$pin_line" -- "$pin_file"); do
              if git show "${c}:${pin_file}" | grep -qxF "$pin_line"; then
                pin_commit="$c"
                break
              fi
            done
            if [[ -z "$pin_commit" ]]; then
              echo "!! no commit on main pins $image — was it deployed to dev?" >&2
              exit 1
            fi
            git checkout production
            git merge --no-edit "$pin_commit" -m "Release ${REF} to production"
            git push origin production
          fi
          echo "## Hosted MCP ${STAGE}: \`${image}\`" >> "$GITHUB_STEP_SUMMARY"

  publish-mcp-registry:
    needs: publish-container
    if: needs.publish-container.outputs.stage == 'prod'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download released .mcpb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ needs.publish-container.outputs.ref }}" \
            --repo "${{ github.repository }}" \
            --pattern 'goodsender.mcpb' \
            --output goodsender.mcpb

      - name: Generate server.json (auto SHA-256)
        run: |
          chmod +x scripts/gen-server-json.sh
          ./scripts/gen-server-json.sh goodsender.mcpb "${{ needs.publish-container.outputs.ref }}"
          cat server.json

      - name: Install mcp-publisher
        run: |
          curl -fsSL \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar -xz mcp-publisher
          sudo install -m 0755 mcp-publisher /usr/local/bin/mcp-publisher
          mcp-publisher --version || true

      - name: Authenticate (GitHub OIDC) and publish
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
