name: Validate Gemini CLI extension

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gemini-extension:
    name: gemini-extension.json checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run validator tests
        run: bash tests/check-gemini-extension.test.sh
      - name: Validate committed manifest
        run: bash scripts/check-gemini-extension.sh gemini-extension.json
