name: Validate metadata

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  schema-validation:
    name: MCP Registry schema validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install schema validator
        run: python -m pip install 'jsonschema[format]==4.23.0'
      # Also runs tests/test_openai_plugin.py (stdlib-only generator checks).
      - name: Validate metadata, template rendering and the OpenAI plugin generator
        run: python -B -m unittest discover -s tests -v

  openai-plugin-package:
    name: OpenAI plugin package (latest release)
    permissions:
      contents: read
    uses: ./.github/workflows/openai-plugin-package.yml
