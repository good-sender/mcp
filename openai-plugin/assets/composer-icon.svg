<?xml version="1.0" encoding="UTF-8"?>
<!--
  The source of truth for every icon in this directory. favicon.ico,
  apple-touch-icon.png, logo192.png and logo512.png are all rendered from this
  file, so regenerate them together and never one on its own.

  The geometry is src/components/landing/LogoMark.tsx verbatim. The colours are
  its two theme tokens resolved to literals, because a standalone SVG is its own
  document and inherits no custom properties:
    #9c3a1a  is the gs-accent token    (rust)
    #fff9f2  is the gs-on-accent token (the label on a rust fill)

  (Token names are written without their leading double hyphen above: an XML
  comment may not contain one.)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
  <rect width="100" height="100" rx="22.37" ry="22.37" fill="#9c3a1a"/>
  <rect x="14" y="22" width="72" height="56" rx="8" ry="8" stroke="#fff9f2" stroke-width="6" fill="none"/>
  <path d="M22 42 L40 60 L82 28" stroke="#fff9f2" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
</svg>
